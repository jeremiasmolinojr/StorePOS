<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F7B5F">
<title>StorePOS Prototype</title>
<style>
/* Layout: one phone-width column; green store band on top, receipt-tape cart, fixed tab bar at the bottom */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --sunk:#E7ECE7; --ink:#14201A; --muted:#5A6961; --line:#D6DED8;
  --brand:#0F7B5F; --brand-strong:#0A5C47; --on-brand:#FFFFFF; --brand-soft:#DCEEE6;
  --tape:#FFFDF4; --tape-line:#E4DCC6; --scrim:rgba(10,20,16,.45);
  --good:#1C7A3A; --good-soft:#DCF0E1; --warn:#9A5800; --warn-soft:#FBEACD; --bad:#B3261E; --bad-soft:#F8DDDA;
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201C; --sunk:#202B26; --ink:#E4EDE8; --muted:#9BABA3; --line:#2B3732;
  --brand:#2FA37E; --brand-strong:#5CCAA4; --on-brand:#04120D; --brand-soft:#173329;
  --tape:#1B2420; --tape-line:#34413B; --scrim:rgba(0,0,0,.6);
  --good:#6DCB8C; --good-soft:#163222; --warn:#E6A84E; --warn-soft:#3A2B13; --bad:#F28A80; --bad-soft:#3D1D1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201C; --sunk:#202B26; --ink:#E4EDE8; --muted:#9BABA3; --line:#2B3732;
  --brand:#2FA37E; --brand-strong:#5CCAA4; --on-brand:#04120D; --brand-soft:#173329;
  --tape:#1B2420; --tape-line:#34413B; --scrim:rgba(0,0,0,.6);
  --good:#6DCB8C; --good-soft:#163222; --warn:#E6A84E; --warn-soft:#3A2B13; --bad:#F28A80; --bad-soft:#3D1D1A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap-in{max-width:560px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .bad{color:var(--bad)} .warn{color:var(--warn)} .good{color:var(--good)} .strong{font-weight:600}

/* header band */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--on-brand)}
header.top .wrap-in{display:flex;align-items:center;gap:10px;padding-block:12px}
.store{flex:1;min-width:0}
.store b{display:block;font:800 19px/1.15 var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store span{font-size:12.5px;opacity:.85}
.who{display:flex;align-items:center;gap:6px;border:0;background:color-mix(in srgb,var(--on-brand) 16%,transparent);color:var(--on-brand);padding:7px 11px;border-radius:999px;font-size:13px;font-weight:600}
.who i{font-style:normal;font-weight:500;opacity:.8}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:10px;background:color-mix(in srgb,var(--on-brand) 16%,transparent);color:var(--on-brand)}
.sample{background:var(--brand-soft);color:var(--ink);font-size:12.5px}
.sample .wrap-in{padding-block:6px}

/* main */
main .wrap-in{padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:14px}
h2.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:6px 0 -4px;font:700 12.5px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2.sec .muted{font:500 12.5px var(--f-body);letter-spacing:0;text-transform:none}
h3{margin:0;font:700 17px/1.25 var(--f-display);text-wrap:balance}
.note{margin:0;color:var(--muted);font-size:13.5px}
.empty{margin:0;padding:18px 14px;color:var(--muted);text-align:center;font-size:14px}

/* controls */
.input{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.input.big{min-height:52px;font-size:17px}
.input.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
select.input{appearance:auto}
.fl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:2px 0 -4px}
.form{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>div{display:grid;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center}
.row>.input{flex:1;min-width:0}
.row.end{justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 16px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:15px;white-space:nowrap}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%}
.btn.grow{flex:1}
.actions{display:flex;gap:8px}
.link{border:0;background:none;padding:4px 0;color:var(--brand-strong);font-weight:600;font-size:14px;text-align:left;justify-self:start}
.check{display:flex;gap:10px;align-items:center;font-size:15px;padding:4px 0}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:flex;gap:4px;padding:4px;background:var(--sunk);border-radius:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:1 1 30%}
.seg.small button{font-size:13px}
fieldset.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:0;display:grid;gap:10px}
legend{font-size:13px;font-weight:700;padding:0 4px}
.flag{display:inline-block;margin-top:4px;padding:3px 8px;border-radius:6px;font-size:12.5px;font-weight:600}
.flag.warn{background:var(--warn-soft);color:var(--warn)}
.flag.bad{background:var(--bad-soft);color:var(--bad)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.good{background:var(--good-soft);color:var(--good)}
.tag{display:inline-block;margin-left:4px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--brand-soft);color:var(--brand-strong);vertical-align:2px}

/* sell */
.suggest{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:-6px}
.suggest button{display:flex;justify-content:space-between;gap:12px;border:0;background:none;padding:12px 14px;text-align:left}
.suggest button+button{border-top:1px solid var(--line)}
.held{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.held .lbl{font-size:12.5px;font-weight:600;color:var(--muted);margin-right:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px}
.tile{display:grid;align-content:space-between;gap:4px;min-height:86px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.tile:active{transform:scale(.98)}
.tname{font-size:13.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tprice{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--brand-strong)}
.tstock{font-size:11.5px;color:var(--muted)}
.tile.low .tstock{color:var(--warn);font-weight:600}
.tile.out{opacity:.7}
.tile.out .tstock{color:var(--bad);font-weight:600}
.tapewrap{filter:drop-shadow(0 0 .5px var(--tape-line)) drop-shadow(0 1px 1px var(--tape-line));margin-bottom:8px}
.tape{position:relative;background:var(--tape);border-radius:10px 10px 0 0}
.tape::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:9px;background:conic-gradient(from 135deg at top,var(--tape) 90deg,transparent 0) 0 0/14px 100% repeat-x}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px dashed var(--tape-line)}
.lname{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.lprice{border:0;background:none;padding:2px 0;font:500 12.5px var(--f-mono);color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:18px;font-weight:600;line-height:1}
.stepper span{min-width:28px;text-align:center;font:600 15px var(--f-mono)}
.lsum{min-width:76px;text-align:right;font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.tape-total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 12px 8px}
.tape-total span{font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.tape-total strong{font:700 24px var(--f-mono);font-variant-numeric:tabular-nums}
.sticky-pay{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:4;padding:10px 0;margin-bottom:-10px;background:var(--bg);border-top:1px solid var(--line)}
.sukli{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-radius:12px;background:var(--sunk)}
.sukli .lbl,.big .lbl,.hero .lbl,.stat .lbl{font:700 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sukli strong{font:800 34px var(--f-display);font-variant-numeric:tabular-nums}
.result{text-align:center;display:grid;gap:6px;padding:8px 0 4px}
.result .lbl{font:700 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.result strong{font:800 52px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--brand-strong)}
.receipt{background:var(--tape);border:1px dashed var(--tape-line);border-radius:10px;padding:10px 12px;font:500 13px/1.6 var(--f-mono);font-variant-numeric:tabular-nums}
.receipt div{display:flex;justify-content:space-between;gap:10px}
.receipt .tot{border-top:1px dashed var(--tape-line);margin-top:6px;padding-top:6px;font-weight:600}

/* lists, cards */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.rowbtn,.rowstatic{display:flex;width:100%;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border:0;background:none;text-align:left}
.rmain{display:grid;gap:2px;min-width:0}
.rname{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.rmeta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.rside{display:grid;justify-items:end;gap:3px;flex:none}
.rprice{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.rmargin{font-size:12px;color:var(--muted)}
.rmargin.bad{color:var(--bad);font-weight:600}
.card{display:grid;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cardhead .muted{font-size:13px}
.hero{display:grid;gap:2px;padding:16px;border-radius:14px;background:var(--brand-soft)}
.hero strong{font:800 34px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.big{display:grid;gap:2px}
.big strong{font:800 32px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kvs{margin:0;display:grid;gap:4px;padding:10px 0;border-block:1px solid var(--line)}
.kvs div,.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kvs dt{color:var(--muted)} .kvs dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.kv strong{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.kv.total{font-weight:700;padding-top:6px;border-top:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:grid;align-content:start;gap:2px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.stat strong{font:700 clamp(16px,4.6vw,21px)/1.2 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat small{font-size:12px;color:var(--muted)}
.tblwrap{overflow-x:auto;margin:0 -2px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:700 11.5px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 6px;white-space:nowrap}
.tbl td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.tbl .n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rline{display:grid;grid-template-columns:minmax(0,1fr) 64px 92px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rline select{grid-column:1/-1}
.rline input[type=date]{grid-column:1/3}
.x{width:40px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:18px;justify-self:end}
.totals{display:grid;align-content:end;gap:2px;font-size:13.5px}
.repack{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center}
.repack .btn{grid-column:1/-1}
.arrow{font:600 13px var(--f-mono);color:var(--muted);text-align:center}
.bars{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;align-items:end;height:110px;padding-top:6px}
.bars i{display:block;background:var(--brand);opacity:.55;border-radius:3px 3px 0 0;min-height:2px}
.bars i.peak{opacity:1}
.barlbl{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;font:500 10.5px var(--f-mono);color:var(--muted)}
.barlbl span{text-align:center;white-space:nowrap}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto;width:100%}
.pinpad button{min-height:56px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:600 22px var(--f-mono)}
.pindots{display:flex;justify-content:center;gap:12px;padding:8px 0}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.on{background:var(--ink);border-color:var(--ink)}
textarea.input{min-height:140px;font:500 12px/1.4 var(--f-mono)}
.confirm{display:grid;gap:8px;padding:12px;border-radius:12px;background:var(--bad-soft)}
.confirm p{margin:0;color:var(--bad);font-weight:600;font-size:14px}

/* photos & scanning */
img{max-width:100%}
.list:empty{display:none}
.thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none;background:var(--sunk);display:grid;place-items:center;font:700 17px var(--f-display);color:var(--muted)}
.timg{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--sunk)}
.btn.sq{min-width:52px;padding:10px 12px}
.btn svg{width:22px;height:22px;flex:none}
.sugl{display:flex;gap:10px;align-items:center;min-width:0}
.rowbtn .rmain{flex:1}
.photorow{display:flex;gap:12px;align-items:center}
.photobox{width:96px;height:96px;border-radius:12px;object-fit:cover;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:12.5px;text-align:center;flex:none;border:1px dashed var(--line)}
.photobtns{display:grid;gap:6px;justify-items:start}
.pcres{display:grid;justify-items:center;gap:6px;text-align:center;padding:6px 0}
.pcres img,.pcres .ph{width:160px;height:160px;border-radius:14px;object-fit:cover}
.pcres .ph{display:grid;place-items:center;background:var(--sunk);font:800 56px var(--f-display);color:var(--muted)}
.pcprice{font:800 48px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--brand-strong)}
.pcres .actions{width:100%}
textarea.plain{font:400 15px/1.5 var(--f-body);min-height:170px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap-in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-block:2px}
.tab{display:grid;justify-items:center;gap:2px;padding:8px 0 7px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:600;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--brand-strong)}
.tab.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.tab .dot{position:absolute;top:5px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:var(--surface);font-size:10px;line-height:16px}

/* sheet + toast */
.sheet{position:fixed;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:var(--scrim);border:0}
.panel{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:92%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:20px var(--gutter-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--gutter-l);display:grid;gap:12px;animation:up .2s ease-out}
.panel>.close{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));width:38px;height:38px;border:0;border-radius:10px;background:var(--sunk);font-size:20px;line-height:1}
#sheetBody{display:grid;gap:12px}
#sheetBody>h3{padding-right:44px}
@keyframes up{from{transform:translate(-50%,24px);opacity:.6}to{transform:translate(-50%,0);opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(520px,calc(100% - 32px));background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.tile:active{transform:none}}
</style>
</head>
<body>

<header class="top"><div class="wrap-in">
  <div class="store"><b id="storeName">StorePOS</b><span id="today"></span></div>
  <button class="who" data-act="user" id="whoBtn"></button>
  <button class="iconbtn" data-act="settings" aria-label="Settings and backup"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
</div></header>
<div class="sample" id="sampleBar"><div class="wrap-in">Sample store data. Change anything; reset or replace it in Settings.</div></div>
<main><div class="wrap-in"><div id="view" class="view"></div></div></main>
<nav class="tabs" aria-label="Sections"><div class="wrap-in" id="tabs"></div></nav>
<div id="sheet" class="sheet" hidden><button class="scrim" data-act="closeSheet" aria-label="Close"></button><div class="panel" role="dialog" aria-modal="true"><button class="close" data-act="closeSheet" aria-label="Close">×</button><div id="sheetBody"></div></div></div>

  var p1=T-8*DAY+18*3600e3,b1=bal('c1',p1); if(b1>2000)S.credit.push({id:++S.seq,t:p1,customerId:'c1',amount:-Math.round(b1/200)*100,saleId:0,method:'gcash',note:'Bayad'});

  S.cashMoves.push({id:++S.seq,t:T-2*DAY+9*3600e3,sessionId:'d2',amount:-24000,reason:'Supplier',note:'Coke truck'});
  var o0=S.sessions[S.sessions.length-1].openedAt;
  S.cashMoves.push({id:++S.seq,t:Math.max(o0+10*60e3,Math.min(now-30*60e3,T+8*3600e3)),sessionId:'d0',amount:-4000,reason:'Fare',note:'Tricycle to the market'});
  S.expenses.push({id:++S.seq,t:T-10*DAY,cat:'Electricity',amount:85000,note:'Meralco'});
  S.expenses.push({id:++S.seq,t:T-3*DAY,cat:'Water',amount:18000,note:''});

function freshStore(legacy){
  var F={v:1,seq:1000,storeName:'My Sari-Sari Store',userId:'u1',sample:false,
    users:[{id:'u1',name:'Owner',role:'owner',pin:'1234'},{id:'u2',name:'Helper',role:'helper',pin:'0000'}],
    categories:['Drinks','Snacks','Instant food','Canned','Coffee & milk','Household','Rice & eggs','Tingi','Other'],
    suppliers:[{id:'s1',name:'Main supplier',days:''}],
    items:[],customers:[],sales:[],moves:[],credit:[],batches:[],sessions:[],cashMoves:[],expenses:[],held:[],purchases:[]};
  (legacy||[]).forEach(function(l,ix){if(!l||!l.name)return;var id='i'+(++F.seq),st=Math.max(0,parseInt(l.stock,10)||0);
    F.items.push({id:id,name:String(l.name),barcode:String(l.barcode||''),cat:'Other',price:Math.max(0,parseInt(l.price,10)||0),cost:0,stock:st,reorder:3,quick:ix<12,sup:'s1',unit:'pc',parentId:'',perPack:0,photo:''});
    if(st)F.moves.push({id:++F.seq,t:Date.now(),itemId:id,qty:st,reason:'opening',ref:'',note:'From StorePOS 1.x',user:'u1'});});
  return F;
}
function normalize(st){st.items.forEach(function(i){if(!(i.stock>=0))i.stock=0;if(i.photo==null)i.photo='';});['customers','sales','moves','credit','batches','sessions','cashMoves','expenses','held','purchases','suppliers'].forEach(function(k){if(!Array.isArray(st[k]))st[k]=[];});return st;}

function item(id){for(var i=0;i<S.items.length;i++)if(S.items[i].id===id)return S.items[i];return null;}
function cust(id){for(var i=0;i<S.customers.length;i++)if(S.customers[i].id===id)return S.customers[i];return null;}
function sup(id){for(var i=0;i<S.suppliers.length;i++)if(S.suppliers[i].id===id)return S.suppliers[i];return null;}
function me(){for(var i=0;i<S.users.length;i++)if(S.users[i].id===S.userId)return S.users[i];return S.users[0];}
function owner(){return me().role==='owner';}
function openSession(){for(var i=0;i<S.sessions.length;i++)if(!S.sessions[i].closedAt)return S.sessions[i];return null;}
function balance(cid){return sum(S.credit.filter(function(e){return e.customerId===cid;}),function(e){return e.amount;});}
function oldestUnpaid(cid){
  var es=S.credit.filter(function(e){return e.customerId===cid;}).sort(function(a,b){return a.t-b.t;});
  var paid=sum(es.filter(function(e){return e.amount<0;}),function(e){return -e.amount;});
  for(var i=0;i<es.length;i++){var e=es[i];if(e.amount<=0)continue;if(paid>=e.amount){paid-=e.amount;continue;}return e.t;}
  return null;
}
function drawerOf(st,s){
  var a=s.openedAt,b=s.closedAt||Date.now()+1;
  function inR(t){return t>=a&&t<b;}
  var live=st.sales.filter(function(x){return x.status==='done'&&inR(x.t);});
  var cashSales=sum(live,function(x){return x.cashIn;});
  var bayad=sum(st.credit.filter(function(e){return e.amount<0&&e.method==='cash'&&inR(e.t);}),function(e){return -e.amount;});
  var mv=st.cashMoves.filter(function(m){return m.sessionId===s.id;});
  var out=sum(mv.filter(function(m){return m.amount<0;}),function(m){return -m.amount;});
  var inn=sum(mv.filter(function(m){return m.amount>0;}),function(m){return m.amount;});
  var gcash=sum(live,function(x){return x.gcashIn;})+sum(st.credit.filter(function(e){return e.amount<0&&e.method==='gcash'&&inR(e.t);}),function(e){return -e.amount;});
  return {float:s.float,cashSales:cashSales,bayad:bayad,out:out,inn:inn,gcash:gcash,expected:s.float+cashSales+bayad+inn-out};
}
function move(itemId,qty,reason,ref,note){
  var it=item(itemId);if(!it||!qty)return;
  it.stock=Math.max(0,it.stock+qty);
  S.moves.push({id:++S.seq,t:Date.now(),itemId:itemId,qty:qty,reason:reason,ref:ref||'',note:note||'',user:S.userId});
  if(qty<0){var q=-qty;S.batches.filter(function(b){return b.itemId===itemId&&b.qty>0;}).sort(function(a,b){return a.expiry-b.expiry;}).forEach(function(b){if(q<=0)return;var k=Math.min(b.qty,q);b.qty-=k;q-=k;});}
}

function cartLine(l,ix){
  var it=item(l.itemId), inCart=sum(ui.cart.filter(function(c){return c.itemId===l.itemId;}),function(c){return c.qty;});
  var short=it&&it.stock-inCart<0, changed=it&&l.price!==it.price;
  return '<div class="line"><div><div class="lname">'+esc(l.name)+'</div><button class="lprice" data-act="editPrice" data-ix="'+ix+'">'+P(l.price)+' each'+(changed?' · changed':'')+'</button>'+(short?'<br><span class="flag warn">Stock says '+it.stock+'. Check the shelf.</span>':'')+'</div>'+
    '<div class="stepper"><button data-act="qty" data-ix="'+ix+'" data-d="-1" aria-label="One less '+esc(l.name)+'">−</button><span>'+l.qty+'</span><button data-act="qty" data-ix="'+ix+'" data-d="1" aria-label="One more '+esc(l.name)+'">+</button></div>'+
    '<div class="lsum">'+P(l.qty*l.price)+'</div></div>';
}
function matches(q){q=q.trim().toLowerCase();if(!q)return [];return S.items.filter(function(i){return i.name.toLowerCase().indexOf(q)>=0||(i.barcode||'').toLowerCase().indexOf(q)>=0;}).slice(0,6);}
function bindSell(){
  var inp=$('#scan');if(!inp)return;
  if(ui.focusScan){inp.focus();ui.focusScan=false;}
  inp.addEventListener('input',function(){
    var ms=matches(inp.value),box=$('#suggest');
    if(!inp.value.trim()){box.hidden=true;return;}
    box.hidden=false;
    box.innerHTML=ms.length?ms.map(function(i){return '<button data-act="add" data-id="'+i.id+'" data-from="search"><span class="sugl">'+thumb(i)+'<span>'+esc(i.name)+'<br><small class="muted">'+esc(i.barcode||'no barcode')+' · '+i.stock+' left</small></span></span><span class="num">'+P(i.price)+'</span></button>';}).join(''):'<button data-act="registerNew" data-code="'+esc(inp.value.trim())+'"><span>No item found. Register “'+esc(inp.value.trim())+'”</span><span>→</span></button>';
  });
  inp.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;e.preventDefault();
    var q=inp.value.trim();if(!q)return;
    var exact=S.items.filter(function(i){return i.barcode&&i.barcode===q;})[0];
    var ms=matches(q);
    if(exact)addToCart(exact.id,true);
    else if(ms.length===1)addToCart(ms[0].id,true);
    else if(!ms.length){unknownCode(q);}
  });
}
function addToCart(id,keepFocus){
  var it=item(id);if(!it)return;
  var l=ui.cart.filter(function(c){return c.itemId===id&&c.price===it.price;})[0];
  if(l)l.qty++;else ui.cart.push({itemId:id,name:it.name,qty:1,price:it.price,cost:it.cost});
  ui.focusScan=!!keepFocus;render();
}

function unknownCode(code){showSheet('<h3>New barcode</h3><p class="note">No item has barcode <span class="mono">'+esc(code)+'</span> yet.</p><button class="btn primary wide" data-act="registerNew" data-code="'+esc(code)+'">Register this item</button>');}

function completeSale(){
  var total=cartTotal(),m=ui.pay.method;
  var sale={id:++S.seq,t:Date.now(),lines:ui.cart.map(function(l){return {itemId:l.itemId,name:l.name,qty:l.qty,price:l.price,cost:l.cost};}),total:total,method:m,cashIn:0,gcashIn:0,creditAmt:0,customerId:'',tendered:0,change:0,user:S.userId,status:'done'};
  if(m==='cash'){var t=money(ui.pay.tendered);if(!(t>=total)){S.seq--;toast('Enter the cash received. It must be at least '+P(total)+'.');return;}sale.tendered=t;sale.change=t-total;sale.cashIn=total;}
  else if(m==='gcash'){sale.gcashIn=total;sale.ref=(ui.pay.ref||'').trim();}
  else{var c=cust(ui.pay.customerId);if(!c){S.seq--;toast('Choose who this utang is for.');return;}
    var n=money(ui.pay.cashNow),cn=isFinite(n)?Math.min(n,total):0;sale.cashIn=cn;sale.creditAmt=total-cn;sale.customerId=c.id;
    if(sale.creditAmt>0)S.credit.push({id:++S.seq,t:sale.t,customerId:c.id,amount:sale.creditAmt,saleId:sale.id,method:'',note:''});}
  S.sales.push(sale);

function saveItem(){
  var id=ui.edit, it=id?item(id):null;
  function v(x){var e=$('#'+x);return e?e.value:'';}
  function err(m){var e=$('#itemErr');e.textContent=m;e.hidden=false;}
  var name=v('f_name').trim(), code=v('f_barcode').trim(), price=money(v('f_price')), cost=owner()?money(v('f_cost')):(it?it.cost:0);
  var reorder=intv(v('f_reorder')), stock=id?it.stock:intv(v('f_stock')||'0'), parent=v('f_parent'), per=intv(v('f_per')||'0');
  if(!name)return err('Enter the item name.');
  if(!isFinite(price)||price<=0)return err('Enter a selling price, like 16 or 16.50.');
  if(owner()&&v('f_cost').trim()&&!isFinite(cost))return err('Cost price should look like 13.50.');
  if(!isFinite(cost))cost=0;
  if(!isFinite(reorder)||reorder<0)return err('Reorder level should be a whole number.');
  if(!isFinite(stock))return err('Starting stock should be a whole number.');
  if(code&&S.items.some(function(x){return x.barcode===code&&x.id!==id;}))return err('Another item already uses barcode '+code+'.');
  if(parent&&(!isFinite(per)||per<1))return err('Enter how many pieces come in one pack.');
  var data={name:name,barcode:code,cat:v('f_cat'),unit:v('f_unit'),price:price,cost:cost,reorder:reorder,sup:v('f_sup'),quick:$('#f_quick').checked,parentId:parent,perPack:parent?per:0,photo:ui.editPhoto||''};
  if(it&&it.photo&&it.photo!==data.photo)dropPhoto(it.photo);
  if(it){for(var k in data)it[k]=data[k];toast('Saved '+name);}
  else{var nid='i'+(++S.seq);data.id=nid;data.stock=0;S.items.push(data);if(stock)move(nid,stock,'opening');toast('Added '+name+' at '+P(price));}
  save();closeSheet();render();
}

/* ---------- STOCK ---------- */
function suggestQty(i){return Math.max(1,i.reorder*2-i.stock);}
var STOCK={
  low:function(){
    var lows=S.items.filter(function(i){return i.stock<=i.reorder;});
    if(!lows.length)return empty('Everything is above its reorder level.');
    var tingi=lows.filter(function(i){return i.parentId;}), buy=lows.filter(function(i){return !i.parentId;}), by={};
    buy.forEach(function(i){(by[i.sup]=by[i.sup]||[]).push(i);});

function statement(cid){

/* ---------- MONEY ---------- */
function viewMoney(){
  var s=openSession(),h='';
  if(!s)h+='<div class="card"><h3>Open the day</h3><p class="note">Count the bills and coins you start with. Closing is measured against this.</p><label class="fl" for="m_float">Starting cash (₱)</label><input id="m_float" class="input money" inputmode="decimal" value="500.00"><button class="btn primary wide" data-act="openDay">Open the day</button></div>';
  else{var d=drawerOf(S,s),mv=S.cashMoves.filter(function(m){return m.sessionId===s.id;});
    h+='<div class="card"><div class="cardhead"><h3>Cash drawer</h3><span class="muted">Opened '+fTime(s.openedAt)+'</span></div><div class="big"><span class="lbl">Should be in the drawer</span><strong>'+P(d.expected)+'</strong></div>'+
      '<dl class="kvs"><div><dt>Starting cash</dt><dd>'+P(d.float)+'</dd></div><div><dt>Cash sales</dt><dd>+ '+P(d.cashSales)+'</dd></div><div><dt>Bayad in cash</dt><dd>+ '+P(d.bayad)+'</dd></div>'+(d.inn?'<div><dt>Cash added</dt><dd>+ '+P(d.inn)+'</dd></div>':'')+'<div><dt>Paid out</dt><dd>− '+P(d.out)+'</dd></div></dl>'+
      '<div class="kv"><span class="muted">GCash / Maya today (not in drawer)</span><strong>'+P(d.gcash)+'</strong></div>'+
      (mv.length?'<div>'+mv.map(function(m){return '<div class="kv"><span class="muted">'+fTime(m.t)+' · '+esc(m.reason)+(m.note?' · '+esc(m.note):'')+'</span><strong>'+(m.amount<0?'−':'+')+P(Math.abs(m.amount))+'</strong></div>';}).join('')+'</div>':'')+
      '<div class="actions"><button class="btn ghost grow" data-act="paidOut">Paid out</button><button class="btn primary grow" data-act="closeDay">Close the day</button></div></div>';}
  if(owner())h+=capitalCard()+expensesCard();
  var past=S.sessions.filter(function(x){return x.closedAt;}).slice(-7).reverse();
  if(past.length)h+='<div class="card"><h3>Past days</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Day</th><th class="n">Expected</th><th class="n">Counted</th><th class="n">Over / short</th></tr></thead><tbody>'+past.map(function(x){var e=x.expected!=null?x.expected:drawerOf(S,x).expected,df=(x.counted||0)-e;
    return '<tr><td>'+fDay(x.openedAt)+'</td><td class="n">'+P(e)+'</td><td class="n">'+P(x.counted)+'</td><td class="n"><span class="pill '+(df<0?'bad':df>0?'warn':'good')+'">'+(df===0?'Exact':(df>0?'+':'')+P(df))+'</span></td></tr>';}).join('')+'</tbody></table></div></div>';

function capitalCard(){
  var stock=sum(S.items,function(i){return Math.max(0,i.stock)*i.cost;}),out=sum(S.customers,function(c){return Math.max(0,balance(c.id));}),s=openSession();
  var cash=s?drawerOf(S,s).expected:((S.sessions.filter(function(x){return x.closedAt;}).slice(-1)[0]||{}).counted||0);
  return '<div class="card"><div class="cardhead"><h3>Where your puhunan is</h3><span class="muted">At cost</span></div><dl class="kvs"><div><dt>On the shelves</dt><dd>'+P(stock)+'</dd></div><div><dt>Out on utang</dt><dd>'+P(out)+'</dd></div><div><dt>Cash in the drawer</dt><dd>'+P(cash)+'</dd></div></dl><div class="kv total"><span>Total capital</span><strong>'+P(stock+out+cash)+'</strong></div>'+
    (out>0.25*(stock+out+cash)?'<p class="flag warn">Over a quarter of your capital is in utang.</p>':'')+'</div>';
}
function expensesCard(){
  var T=new Date(),m0=new Date(T.getFullYear(),T.getMonth(),1).getTime();
  var ex=S.expenses.filter(function(e){return e.t>=m0;}).sort(function(a,b){return b.t-a.t;});
  var sales=S.sales.filter(function(x){return x.status==='done'&&x.t>=m0;});
  var gp=sum(sales,function(x){return sum(x.lines,function(l){return l.qty*(l.price-l.cost);});});
  var draw=sum(S.moves.filter(function(m){return m.reason==='draw'&&m.t>=m0;}),function(m){var it=item(m.itemId);return -m.qty*(it?it.cost:0);});

    '<dl class="kvs"><div><dt>Gross profit from sales</dt><dd>'+P(gp)+'</dd></div><div><dt>Expenses</dt><dd>− '+P(exT)+'</dd></div>'+(draw?'<div><dt>Goods taken for the house</dt><dd>− '+P(draw)+'</dd></div>':'')+'</dl>'+
    '<div class="kv total"><span>Net profit so far</span><strong class="'+(gp-exT-draw<0?'bad':'')+'">'+P(gp-exT-draw)+'</strong></div>'+
    (ex.length?'<div>'+ex.map(function(e){return '<div class="kv"><span class="muted">'+fDate(e.t)+' · '+esc(e.cat)+(e.note?' · '+esc(e.note):'')+'</span><strong>'+P(e.amount)+'</strong></div>';}).join('')+'</div>':'')+'</div>';
}

/* ---------- REPORTS ---------- */
function rangeOf(){var now=Date.now(),T=sod(now);return ui.range==='today'?[T,now+1]:ui.range==='7'?[T-6*DAY,now+1]:[T-29*DAY,now+1];}
function viewReports(){
  if(!owner())return '<div class="card"><h3>Reports are for the owner</h3><p class="note">Profit and cost figures are hidden for helpers. Switch to the owner account from the name at the top.</p></div>';
  var rg=rangeOf(),a=rg[0],b=rg[1];
  var sales=S.sales.filter(function(x){return x.status==='done'&&x.t>=a&&x.t<b;});
  var rev=sum(sales,function(x){return x.total;}),cogs=sum(sales,function(x){return sum(x.lines,function(l){return l.qty*l.cost;});}),gp=rev-cogs;
  var given=sum(sales,function(x){return x.creditAmt;}),paid=sum(S.credit.filter(function(e){return e.amount<0&&(e.method==='cash'||e.method==='gcash')&&e.t>=a&&e.t<b;}),function(e){return -e.amount;});
  var h='<div class="seg" role="group" aria-label="Period">'+[['today','Today'],['7','7 days'],['30','30 days']].map(function(o){return '<button class="'+(ui.range===o[0]?'on':'')+'" aria-pressed="'+(ui.range===o[0])+'" data-act="range" data-r="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div>';
  h+='<div class="stats"><div class="stat"><span class="lbl">Sales</span><strong>'+P(rev)+'</strong><small>'+sales.length+' sale'+(sales.length===1?'':'s')+'</small></div><div class="stat"><span class="lbl">Gross profit</span><strong>'+P(gp)+'</strong><small>'+(rev?(gp/rev*100).toFixed(1):'0.0')+'% margin</small></div><div class="stat"><span class="lbl">Utang given</span><strong>'+P(given)+'</strong><small>Bayad in '+P(paid)+'</small></div></div>';
  var hrs=[];for(var i=6;i<22;i++)hrs.push(0);
  sales.forEach(function(x){var hr=new Date(x.t).getHours();if(hr>=6&&hr<22)hrs[hr-6]++;});
  var mx=Math.max.apply(null,hrs.concat([1]));
  h+='<div class="card"><div class="cardhead"><h3>Busiest hours</h3><span class="muted">Number of sales</span></div><div class="bars" aria-hidden="true">'+hrs.map(function(n){return '<i class="'+(n===mx&&n>0?'peak':'')+'" style="height:'+(n/mx*100)+'%" title="'+n+'"></i>';}).join('')+'</div><div class="barlbl">'+hrs.map(function(n,ix){var hr=ix+6;return '<span>'+(ix%3===0?(hr===12?'12p':hr>12?(hr-12)+'p':hr+'a'):'')+'</span>';}).join('')+'</div></div>';
  var agg={};sales.forEach(function(x){x.lines.forEach(function(l){var g=agg[l.itemId]=agg[l.itemId]||{id:l.itemId,name:l.name,qty:0,rev:0,gp:0};g.qty+=l.qty;g.rev+=l.qty*l.price;g.gp+=l.qty*(l.price-l.cost);});});
  var earn=Object.keys(agg).map(function(k){return agg[k];}).sort(function(x,y){return y.gp-x.gp;});
  h+='<div class="card"><div class="cardhead"><h3>What earns</h3><span class="muted">By profit, not sales</span></div>'+(earn.length?'<div class="tblwrap"><table class="tbl"><thead><tr><th>Item</th><th class="n">Sold</th><th class="n">Sales</th><th class="n">Profit</th><th class="n">Margin</th></tr></thead><tbody>'+earn.slice(0,10).map(function(g){var pc=g.rev?g.gp/g.rev*100:0;return '<tr><td>'+esc(g.name)+'</td><td class="n">'+g.qty+'</td><td class="n">'+P(g.rev)+'</td><td class="n strong">'+P(g.gp)+'</td><td class="n'+(pc<10?' bad':'')+'">'+pc.toFixed(0)+'%</td></tr>';}).join('')+'</tbody></table></div>':empty('No sales in this period yet.'))+'</div>';
  var since=Date.now()-30*DAY,sold={};S.moves.forEach(function(m){if(m.reason==='sale'&&m.t>=since)sold[m.itemId]=1;});
  var dead=S.items.filter(function(i){return i.stock>0&&!sold[i.id]&&!i.parentId;});
  var exp=S.batches.filter(function(bt){return bt.qty>0&&bt.expiry&&bt.expiry-Date.now()<=14*DAY;}).length;
  var low=S.items.filter(function(i){return i.stock<=i.reorder;}).length;
  h+='<div class="stats"><button class="stat" data-act="goStock" data-s="low" style="text-align:left"><span class="lbl">To buy</span><strong>'+low+'</strong><small>items at reorder level</small></button><button class="stat" data-act="goStock" data-s="expiry" style="text-align:left"><span class="lbl">Expiring</span><strong>'+exp+'</strong><small>batches within 14 days</small></button><div class="stat"><span class="lbl">Dead stock</span><strong>'+P(sum(dead,function(i){return i.stock*i.cost;}))+'</strong><small>'+dead.length+' items, no sale in 30 days</small></div></div>';
  if(dead.length)h+='<div class="card"><div class="cardhead"><h3>Dead stock</h3><span class="muted">Capital sitting on the shelf</span></div>'+dead.map(function(i){return '<div class="kv"><span>'+esc(i.name)+' <span class="muted">· '+i.stock+' '+esc(i.unit)+'</span></span><strong>'+P(i.stock*i.cost)+'</strong></div>';}).join('')+'<p class="note">Consider a small discount, or stop reordering these.</p></div>';
  var hist=S.sales.filter(function(x){return x.t>=a&&x.t<b;}).slice(-30).reverse();
  h+='<h2 class="sec">Sales <span class="muted">tap to see or cancel</span></h2>'+(hist.length?'<ul class="list">'+hist.map(function(x){var c=x.customerId?cust(x.customerId):null;
    return '<li><button class="rowbtn" data-act="openSale" data-id="'+x.id+'"><span class="rmain"><span class="rname">#'+x.id+' · '+fTime(x.t)+(ui.range!=='today'?' · '+fDate(x.t):'')+'</span><span class="rmeta">'+sum(x.lines,function(l){return l.qty;})+' items · '+(x.method==='cash'?'Cash':x.method==='gcash'?'GCash / Maya':'Utang · '+esc(c?c.name:''))+'</span></span><span class="rside"><span class="rprice">'+P(x.total)+'</span>'+(x.status==='void'?'<span class="pill bad">Cancelled</span>':'')+'</span></button></li>';}).join('')+'</ul>':empty('No sales in this period.'));
  return h;
}
function saleSheet(id){
  var s=S.sales.filter(function(x){return x.id===id;})[0];if(!s)return '';
  return '<h3>Sale #'+s.id+(s.status==='void'?' <span class="pill bad">Cancelled</span>':'')+'</h3>'+receiptHTML(s)+
    (s.status==='done'&&owner()?'<div id="voidBox"><button class="btn danger wide" data-act="askVoid" data-id="'+s.id+'">Cancel this sale</button></div>':'')+
    (s.status==='done'&&!owner()?'<p class="note">Only the owner can cancel a finished sale.</p>':'');
}
function voidSale(id){
  var s=S.sales.filter(function(x){return x.id===id;})[0];if(!s||s.status!=='done')return;
  s.status='void';
  s.lines.forEach(function(l){move(l.itemId,l.qty,'void',s.id);});
  if(s.creditAmt>0)S.credit.push({id:++S.seq,t:Date.now(),customerId:s.customerId,amount:-s.creditAmt,saleId:s.id,method:'void',note:'Cancelled sale #'+s.id});
  save();closeSheet();render();toast('Sale #'+id+' cancelled. Stock returned'+(s.creditAmt?' and utang removed':'')+'.');
}

  showBackup:function(){var txt=JSON.stringify(S);$('#backupBox').innerHTML='<label class="fl" for="bk">Backup ('+Math.round(txt.length/1024)+' KB)</label><textarea id="bk" class="input" readonly>'+esc(txt)+'</textarea><button class="btn ghost wide" data-act="copyBackup">Copy backup</button>';},
  copyBackup:function(){var t=$('#bk');try{navigator.clipboard.writeText(t.value).then(function(){toast('Backup copied.');},function(){t.focus();t.select();toast('Select all and copy.');});}catch(e){t.focus();t.select();}},
  showRestore:function(){$('#backupBox').innerHTML='<label class="fl" for="rs">Paste a backup</label><textarea id="rs" class="input"></textarea><button class="btn danger wide" data-act="restore">Replace everything with this backup</button>';},
  restore:function(){var o;try{o=JSON.parse($('#rs').value);}catch(e){toast('That is not a StorePOS backup.');return;}if(!o||o.v!==1||!Array.isArray(o.items)){toast('That is not a StorePOS backup.');return;}S=normalize(o);ui.cart=[];save();closeSheet();render();toast('Backup restored.');},
  askReset:function(d){ui.resetKind=d.k;$('#resetBox').innerHTML='<div class="confirm" style="flex:1"><p>'+(d.k==='sample'?'Erase this store and load the sample store?':'Erase everything and start an empty store?')+'</p><div class="actions"><button class="btn ghost grow" data-act="closeSheet">Keep my data</button><button class="btn danger grow" data-act="reset">Erase</button></div></div>';},
  reset:function(){S.items.forEach(function(i){dropPhoto(i.photo);});S=normalize(ui.resetKind==='empty'?freshStore([]):seed());ui.cart=[];ui.recv=null;save();closeSheet();setTab('sell');toast(ui.resetKind==='empty'?'Empty store ready.':'Sample store loaded.');},
  camScan:function(){scanBarcode('Scan an item to add it to the sale',function(code){var it=S.items.filter(function(i){return i.barcode===code;})[0];if(it){addToCart(it.id);toast('Added '+it.name+'.');}else unknownCode(code);});},
  scanInto:function(){scanBarcode('Scan the item\'s barcode',function(code){var f=$('#f_barcode');if(!f)return;f.value=code;var other=S.items.filter(function(x){return x.barcode===code&&x.id!==ui.edit;})[0],e=$('#itemErr');if(other){e.textContent='Barcode '+code+' already belongs to '+other.name+'.';e.hidden=false;}else e.hidden=true;});},
  itemPhoto:function(){takePhoto(function(url){ui.editPhoto=url;var r=$('#photoRow');if(r)r.innerHTML=photoRowHTML();});},
  itemPhotoRemove:function(){ui.editPhoto='';var r=$('#photoRow');if(r)r.innerHTML=photoRowHTML();},
  priceCheck:function(){showSheet(priceSheet());},
  pcScan:function(){scanBarcode('Scan an item to check its price',function(code){if(!$('#pcResult'))showSheet(priceSheet());var it=S.items.filter(function(i){return i.barcode===code;})[0];$('#pcList').innerHTML='';
    $('#pcResult').innerHTML=it?pcResultHTML(it):'<div class="pcres"><p class="note">No item has barcode <span class="mono">'+esc(code)+'</span> yet.</p><button class="btn primary" data-act="registerNew" data-code="'+esc(code)+'">Register this item</button></div>';});},
  pcShow:function(d){var it=item(d.id);if(!it)return;$('#pcList').innerHTML='';$('#pcResult').innerHTML=pcResultHTML(it);},
  pcAdd:function(d){var it=item(d.id);closeSheet();addToCart(d.id);setTab('sell');if(it)toast('Added '+it.name+'.');},
  saveStaff:function(){var err=$('#staffErr'),nu=[];for(var i=0;i<S.users.length;i++){var n=$('#us_n'+i).value.trim(),p=$('#us_p'+i).value.trim();if(!n){err.textContent='Every staff member needs a name.';err.hidden=false;return;}if(!/^\d{4}$/.test(p)){err.textContent='PINs must be exactly 4 digits.';err.hidden=false;return;}nu.push([n,p]);}
    nu.forEach(function(x,i){S.users[i].name=x[0];S.users[i].pin=x[1];});err.hidden=true;save();renderShell();toast('Staff saved.');},
  saveSuppliers:function(){var out=[],n=S.suppliers.length;for(var i=0;i<=n;i++){var nm=$('#sp_n'+i).value.trim(),dy=$('#sp_d'+i).value.trim();if(i<n){if(nm)out.push({id:S.suppliers[i].id,name:nm,days:dy});}else if(nm)out.push({id:'s'+(++S.seq),name:nm,days:dy});}
    S.suppliers=out;save();showSheet(settingsSheet());toast('Suppliers saved.');},
  saveCategories:function(){var c=$('#st_cats').value.split('\n').map(function(x){return x.trim();}).filter(function(x,i,a){return x&&a.indexOf(x)===i;});if(!c.length){toast('Keep at least one category.');return;}
    S.categories=c;if(ui.itemCat!=='All'&&c.indexOf(ui.itemCat)<0)ui.itemCat='All';save();render();toast('Categories saved.');},
  saveBackupFile:function(){var d=new Date(),n='storepos-backup-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';NATIVE.saveBackup(JSON.stringify(S),n);},
  openBackupFile:function(){NATIVE.openBackup(req(function(text){if(!text)return;var o;try{o=JSON.parse(text);}catch(e){toast('That file is not a StorePOS backup.');return;}if(!o||o.v!==1||!Array.isArray(o.items)){toast('That file is not a StorePOS backup.');return;}
    ui.restoreObj=o;var b=$('#backupBox');if(b)b.innerHTML='<div class="confirm"><p>Replace everything with this backup ('+o.items.length+' items, '+(o.sales||[]).length+' sales)?</p><div class="actions"><button class="btn ghost grow" data-act="closeSheet">Cancel</button><button class="btn danger grow" data-act="restoreObj">Restore</button></div></div>';}));},
  restoreObj:function(){if(!ui.restoreObj)return;S=normalize(ui.restoreObj);ui.restoreObj=null;ui.cart=[];save();closeSheet();render();toast('Backup restored.');}
};
function bayadSeg(){return [['cash','Cash'],['gcash','GCash / Maya']].map(function(o){return '<button class="'+(ui.bayadM===o[0]?'on':'')+'" aria-pressed="'+(ui.bayadM===o[0])+'" data-act="bayadM" data-m="'+o[0]+'">'+o[1]+'</button>';}).join('');}

document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t||t.disabled)return;var f=ACT[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t);}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});
document.addEventListener('input',function(e){
  var t=e.target,id=t.id;
  if(id==='tendered'){ui.pay.tendered=t.value;$('#sukliBox').innerHTML=sukliHTML();}
  else if(id==='gref')ui.pay.ref=t.value;
  else if(id==='cashNow'){ui.pay.cashNow=t.value;$('#utangInfo').innerHTML=utangInfoHTML();}
  else if(id==='pc_q'){var ms=matches(t.value);$('#pcResult').innerHTML='';$('#pcList').innerHTML=ms.length?'<div class="list">'+ms.map(function(i){return '<button class="rowbtn" data-act="pcShow" data-id="'+i.id+'">'+thumb(i)+'<span class="rmain"><span class="rname">'+esc(i.name)+'</span><span class="rmeta">'+esc(i.barcode||'no barcode')+' · '+i.stock+' left</span></span><span class="rprice">'+P(i.price)+'</span></button>';}).join('')+'</div>':(t.value.trim()?empty('No item matches.'):'');}
  else if(id==='itemQ'){ui.itemQ=t.value;$('#itemList').innerHTML=itemListHTML();}
  else if(id==='f_price'||id==='f_cost'){var ml=$('#marginLine');if(ml)ml.innerHTML=marginLine(money($('#f_price').value),money(($('#f_cost')||{}).value),$('#f_unit').value);}
  else if(id==='r_fee'){ui.recv.fee=t.value;$('#r_total').innerHTML=recvTotalHTML();}
  else if(t.dataset&&t.dataset.r&&t.dataset.r!=='itemId'){ui.recv.lines[+t.dataset.ix][t.dataset.r]=t.value;$('#r_total').innerHTML=recvTotalHTML();}
  else if(id==='a_qty')ui.adj.qty=t.value;
  else if(id==='a_counted'){ui.adj.counted=t.value;$('#a_diff').textContent=adjDiff();}
  else if(id==='a_note')ui.adj.note=t.value;
  else if(id==='cl_count'){var s=openSession(),c=money(t.value),e2=drawerOf(S,s).expected;$('#clDiff').innerHTML=!isFinite(c)?'<span class="lbl">Over / short</span><strong>—</strong>':c===e2?'<span class="lbl">Exact</span><strong class="good">'+P(0)+'</strong>':'<span class="lbl">'+(c>e2?'Over':'Short')+'</span><strong class="'+(c>e2?'warn':'bad')+'">'+P(Math.abs(c-e2))+'</strong>';}
});
document.addEventListener('change',function(e){
  var t=e.target,id=t.id;
  if(id==='ucust'){ui.pay.customerId=t.value;$('#utangInfo').innerHTML=utangInfoHTML();}
  else if(id==='r_sup')ui.recv.supplierId=t.value;
  else if(id==='r_paid')ui.recv.paid=t.checked;
  else if(t.dataset&&t.dataset.r==='itemId'){var l=ui.recv.lines[+t.dataset.ix],it=item(t.value);l.itemId=t.value;if(it){if(!l.cost)l.cost=(it.cost/100).toFixed(2);if(!l.qty)l.qty=String(suggestQty(it));}$('#r_lines').innerHTML=ui.recv.lines.map(recvLine).join('');$('#r_total').innerHTML=recvTotalHTML();}
  else if(t.dataset&&t.dataset.r==='expiry'){ui.recv.lines[+t.dataset.ix].expiry=t.value;}
  else if(id==='a_item'){ui.adj.itemId=t.value;var d=$('#a_diff');if(d)d.textContent=adjDiff();}
  else if(id==='st_name'){var v=t.value.trim();if(v){S.storeName=v;save();renderShell();}}
  else if(id==='f_unit'){var ml=$('#marginLine');if(ml)ml.innerHTML=marginLine(money($('#f_price').value),money(($('#f_cost')||{}).value),t.value);}
});

window.StorePOSBack=function(){if(!$('#sheet').hidden){closeSheet();return true;}if(ui.tab!=='sell'){setTab('sell');return true;}return false;};
if(!VIEWS[ui.tab])ui.tab='sell';
save();render();
})();
</script>
</body>
